<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GetFlex — Movie Catalog</title>
  <meta name="description" content="GetFlex: browse trending, top rated and action movies.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d0d0d'/%3E%3Cpath d='M46 20A20 20 0 1 0 50 32H34' fill='none' stroke='%2300FF66' stroke-width='10'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar" id="navbar">
  <a href="#" class="brand" data-nav="home" aria-label="GetFlex home">
    <svg class="logo" viewBox="0 0 64 80" aria-hidden="true">
      <defs>
        <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00FF66"/><stop offset="1" stop-color="#00E65B"/>
        </linearGradient>
        <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="gMask" maskUnits="userSpaceOnUse" x="-10" y="0" width="90" height="80">
          <path d="M50.4 24.6A24 24 0 1 0 56 40" fill="none" stroke="#fff" stroke-width="14"/>
          <rect x="34" y="34" width="24" height="12" fill="#fff"/>
        </mask>
      </defs>
      <!-- main ribbon arc -->
      <path d="M50.4 24.6A24 24 0 1 0 56 40" fill="none" stroke="url(#gA)" stroke-width="14"/>
      <!-- folded bar (darker, like the N's diagonal) -->
      <path d="M34 40H58" stroke="#00B347" stroke-width="12" fill="none"/>
      <polygon points="58,34 46,34 58,46" fill="#007a30"/>
      <g mask="url(#gMask)"><rect class="shine" x="-30" y="0" width="22" height="80" fill="url(#gShine)"/></g>
    </svg>
    <span class="brand-name">GetFlex</span>
  </a>

  <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>

  <nav class="nav-links" id="navLinks" aria-label="Primary">
    <a href="#" data-nav="home" class="active">Home</a>
    <a href="#" data-nav="trending">Trending</a>
    <a href="#" data-nav="movies">Movies</a>
    <a href="#" data-nav="mylist">My List <span class="count" id="listCount" hidden>0</span></a>
  </nav>

  <div class="search" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4-4"/></svg>
    <input id="searchInput" type="search" placeholder="Search movies" autocomplete="off" aria-label="Search movies">
  </div>
</header>

<main id="app">
  <!-- HERO -->
  <section class="hero" id="hero" aria-live="polite">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-content">
      <h1 id="heroTitle">Loading…</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p id="heroOverview"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="heroPlay">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play Now
        </button>
        <button class="btn btn-ghost" id="heroInfo">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 8v5m0-8.5v.01"/></svg> More Info
        </button>
      </div>
    </div>
    <div class="hero-progress"><span id="heroProgress"></span></div>
  </section>

  <div id="rows"></div>
  <section id="searchResults" class="results" hidden></section>
</main>

<footer class="footer">
  <p>GetFlex is a demo catalog. Movie data and images provided by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</footer>

<!-- PLAYER / DETAILS MODAL -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <div class="modal-bar" id="modalBar"><span></span></div>
    <button class="icon-btn modal-close" data-close aria-label="Close player">✕</button>
    <div class="player">
      <iframe id="playerFrame" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="origin"></iframe>
      <div class="player-empty" id="playerEmpty" hidden></div>
    </div>
    <div class="modal-info">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <div class="hero-meta" id="modalMeta"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost sm" id="addListBtn"></button>
          <button class="btn btn-ghost sm" id="switchBtn" title="Switch player source">⇄ <span id="sourceName">Source</span></button>
          <button class="btn btn-primary sm" id="externalBtn">Open externally ↗</button>
        </div>
      </div>
      <p id="modalOverview"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
